<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mensajería · SCaD MNS</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}iframe{display:block;width:100%;height:100%;border:0;background:#f4f7fb}</style></head><body><iframe id="mnsCore" src="mns-frontend.html?v=0.5.12" title="Mensajería"></iframe><script>(()=>{'use strict';const f=document.getElementById('mnsCore');const ORIGIN=location.origin;addEventListener('message',e=>{if(e.origin!==ORIGIN)return;if(e.source===f.contentWindow){parent.postMessage(e.data,ORIGIN);return}if(e.source===parent){f.contentWindow?.postMessage(e.data,ORIGIN)}})})();</script></body></html>
