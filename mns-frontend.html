<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mensajería · SCaD MNS</title>
<style>
:root{
  --bg:#f6f8fb;
  --surface:#ffffff;
  --ink:#0d2342;
  --muted:#5e7391;
  --line:#dce5ef;
  --blue:#0e67d7;
  --blue-soft:#edf5ff;
  --red:#ef1b23;
  --red-soft:#ffe3e5;
  --green-soft:#ddf7e8;
  --violet-soft:#eee8ff;
  --shadow:0 8px 24px rgba(16,52,91,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e9eef5}
button,input,textarea{font:inherit}
button{cursor:pointer}
.shell{width:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(13px + env(safe-area-inset-top)) 14px 12px;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.brand-icon{width:32px;height:32px;color:var(--blue);display:grid;place-items:center;font-size:24px;font-weight:900}
.title{font-size:18px;font-weight:900;letter-spacing:-.25px}
.icon-btn{width:36px;height:36px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border-radius:10px;font-size:21px}
.global-alert{min-width:30px;height:30px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;position:relative;box-shadow:0 0 0 0 rgba(239,27,35,.42);animation:pulse 1.65s infinite}
.global-alert::after{content:"";position:absolute;inset:-5px;border-radius:999px;border:2px solid rgba(239,27,35,.16)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,27,35,.42)}65%{box-shadow:0 0 0 10px rgba(239,27,35,0)}100%{box-shadow:0 0 0 0 rgba(239,27,35,0)}}
.view{display:none;flex:1;min-height:0;overflow:auto}.view.active{display:block}.body{padding:12px 14px 24px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.quick-btn{min-height:52px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px 7px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);font-weight:900;font-size:12px;box-shadow:0 3px 9px rgba(14,48,83,.025);position:relative}
.quick-btn.active{border:2px solid var(--blue);background:linear-gradient(180deg,#fff,#f3f8ff)}
.quick-icon{width:auto;height:auto;border-radius:0;background:transparent;display:inline-grid;place-items:center;font-size:21px;font-weight:900;color:var(--blue);line-height:1}
.quick-btn[data-key="SYSTEM"] .quick-icon{background:transparent;color:#6d7f95}.quick-btn[data-key="CONTACTS"] .quick-icon{background:transparent;color:#0c55a8}
.tab-alert{position:absolute;top:6px;right:7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--red);color:#fff;font-size:9px;font-weight:900;animation:pulse 1.65s infinite}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-bottom:12px}.searchbox{position:relative}
.searchbox input{width:100%;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 38px 0 12px;outline:none;color:var(--ink)}
.searchbox input:focus{border-color:#8cb8ea;box-shadow:0 0 0 3px #e6f1fd}.searchmark{position:absolute;right:12px;top:9px;color:var(--muted);font-size:18px;pointer-events:none}
.filter-btn{height:42px;border:1px solid #9fc3ee;background:#fff;color:var(--ink);border-radius:12px;padding:0 11px;display:flex;align-items:center;gap:7px;font-weight:800;font-size:11px}.filter-btn.on{background:#edf5ff;border-color:var(--blue);color:var(--blue)}
.filter-count{min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:white;display:grid;place-items:center;font-size:9px;font-weight:900;animation:pulse 1.65s infinite}
.compose-btn{width:42px;height:42px;border:0;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 6px 16px rgba(14,103,215,.2)}
.list{display:grid;gap:9px}.row{width:100%;border:1px solid #edf1f5;background:#fff;border-radius:16px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;text-align:left;box-shadow:var(--shadow);min-height:70px}
.avatar{width:48px;height:48px;border-radius:50%;background:#ddebff;color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:900}.avatar.system{background:#edf0f4;color:#6d8097}.avatar.attention{background:#ddebff;color:#0d5ea8}.avatar.role{background:var(--violet-soft);color:#5c49a6}.avatar.role-green{background:var(--green-soft);color:#0c7051}
.row-main{min-width:0}.name-line{display:flex;align-items:center;gap:7px;min-width:0}.name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role-tag{flex:none;font-size:9px;font-weight:900;padding:3px 6px;border-radius:999px;color:#5f7188;background:#edf1f5;text-transform:uppercase}.preview{margin-top:4px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{align-self:center;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:center;justify-items:end;column-gap:7px;row-gap:5px;min-width:52px}.time{grid-column:1/3;font-size:10px;color:var(--muted);line-height:1}.side .unread{grid-column:1;grid-row:2}.side .chev{grid-column:2;grid-row:2}
.unread{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900;position:relative}.chev{font-size:24px;color:#7c8da3;line-height:1}.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);background:#fff;border-radius:15px}
.group-title{margin:15px 3px 7px;font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--muted)}.group-title:first-child{margin-top:2px}.contact-list{display:grid;gap:8px}.contact-row{width:100%;border:1px solid #edf1f5;background:#fff;border-radius:15px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;text-align:left}
.chat-view{display:none;flex:1;min-height:0;flex-direction:column}.chat-view.active{display:flex}.chat-head{flex:none;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:9px;align-items:center;padding:9px 10px}.chat{flex:1;overflow:auto;padding:13px}.day{text-align:center;margin:7px 0 14px}.day span{background:#e9eef3;color:var(--muted);font-size:10px;border-radius:999px;padding:5px 9px}.bubble-line{display:flex;margin:7px 0}.bubble-line.mine{justify-content:flex-end}.bubble{max-width:82%;padding:9px 11px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#ddecfb;border-color:#ddecfb;border-radius:14px 14px 4px 14px}.stamp{font-size:9px;color:var(--muted);text-align:right;margin-top:4px}.composer{flex:none;background:#fff;border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.composer textarea{width:100%;min-height:42px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:13px;padding:10px 11px;outline:none}.send{width:42px;height:42px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:18px}.readonly{flex:none;background:#fff;border-top:1px solid var(--line);padding:14px;text-align:center;color:var(--muted);font-size:12px}
.overlay{position:absolute;inset:0;background:#14243666;display:none;align-items:flex-end;z-index:30}.overlay.on{display:flex}.sheet{width:100%;max-height:86%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:17px 14px calc(18px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 13px;font-size:17px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800;color:var(--muted)}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.exact-note{font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:-3px;margin-bottom:10px}.result-none{padding:18px;text-align:center;color:var(--muted);font-size:11px;border:1px dashed var(--line);border-radius:13px}.result-ok{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.toast{position:absolute;left:10%;bottom:24px;width:80%;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;text-align:center;font-size:12px;display:none;z-index:40}.toast.on{display:block}.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand-icon">💬</div><div class="title">Mensajes</div><div class="global-alert" id="globalBadge">5</div><button class="icon-btn" id="btnExit">×</button></header>
<section class="view active" id="homeView"><div class="body">
<div class="quick">
<button class="quick-btn" data-key="SYSTEM" id="btnSystem"><span class="quick-icon">⚙️</span><span>SISTEMA</span></button>
<button class="quick-btn active" data-key="ATTENTION" id="btnAttention"><span class="quick-icon">👤</span><span>ATENCIÓN</span><span class="tab-alert" id="attentionBadge">3</span></button>
<button class="quick-btn" data-key="CONTACTS" id="btnContacts"><span class="quick-icon">👥</span><span>CONTACTOS</span></button>
</div>
<div class="toolbar"><div class="searchbox"><input id="conversationSearch" type="search" placeholder="Buscar en conversaciones..." autocomplete="off"><span class="searchmark">⌕</span></div><button class="filter-btn" id="btnUnread"><span>☷</span><span>No leídos</span><span class="filter-count" id="unreadFilterCount">5</span></button><button class="compose-btn" id="btnNew" title="Nueva conversación">✎</button></div>
<div id="conversationList" class="list"></div></div></section>
<section class="view" id="contactsView"><div class="body"><div class="searchbox" style="margin-bottom:10px"><input id="contactSearch" type="search" placeholder="Buscar en contactos..." autocomplete="off"><span class="searchmark">⌕</span></div><div id="contactsList"></div></div></section>
<section class="chat-view" id="chatView"><div class="chat-head"><button class="icon-btn" id="btnChatBack">←</button><div class="avatar" id="chatAvatar">A</div><div class="row-main"><div class="name" id="chatTitle"></div><div class="preview" id="chatType"></div></div></div><div class="chat" id="chat"></div><div class="composer" id="composer"><textarea id="messageText" rows="1" maxlength="5000" placeholder="Escribe un mensaje"></textarea><button class="send" id="btnSend">➤</button></div><div class="readonly hidden" id="readonly">Este canal es de solo lectura.</div></section>
<div class="overlay" id="newOverlay"><div class="sheet"><h3>Nueva conversación</h3><div class="tabs"><button class="tab on" data-newtab="contacts">Contactos</button><button class="tab" data-newtab="new">Buscar nuevo contacto</button></div><div id="newContactsPane"><div class="searchbox" style="margin-bottom:10px"><input id="newContactsSearch" type="search" placeholder="Buscar en contactos..." autocomplete="off"><span class="searchmark">⌕</span></div><div id="newContactsList"></div></div><div id="newExternalPane" class="hidden"><div class="searchbox" style="margin-bottom:8px"><input id="exactSearch" type="search" placeholder="Nombre completo o email" autocomplete="off"><span class="searchmark">⌕</span></div><div class="exact-note">El resultado sólo se mostrará cuando exista coincidencia exacta con el nombre completo o el email.</div><div id="exactResult"></div></div></div></div><div class="toast" id="toast"></div>
</div>
<script>
(() => {
'use strict';

const CHANNEL = 'MNS_FRONTEND';
const VERSION = '0.5.13';
const REQUEST_TIMEOUT = 15000;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const initials = s => String(s||'M').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const uid = () => globalThis.crypto?.randomUUID?.() || `req-${Date.now()}-${Math.random().toString(36).slice(2)}`;

const state = {
  context:null,
  session:null,
  active:null,
  unreadOnly:false,
  conversations:[],
  roles:[],
  users:[],
  messages:{},
  exactSearchCache:new Map(),
  loading:false
};

const pending = new Map();

function fmt(v){
  if(!v) return '';
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return '';
  const now=new Date(), diff=(now-d)/86400000;
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  if(diff<2) return 'Ayer';
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}).replace('.','');
}

function toast(t){
  $('#toast').textContent=t;
  $('#toast').classList.add('on');
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>$('#toast').classList.remove('on'),2500);
}

function showMain(view){
  $('#homeView').classList.toggle('active',view==='home');
  $('#contactsView').classList.toggle('active',view==='contacts');
  $('#chatView').classList.toggle('active',view==='chat');
}

function request(action,payload={}){
  if(!state.context) return Promise.reject(new Error('MNS no recibió el contexto de la APP.'));
  return new Promise((resolve,reject)=>{
    const id=uid();
    const timer=setTimeout(()=>{
      pending.delete(id);
      reject(new Error('No hubo respuesta de MNS.'));
    },REQUEST_TIMEOUT);
    pending.set(id,{resolve,reject,timer});
    window.parent.postMessage({channel:CHANNEL,id,action,payload},window.location.origin);
  });
}

function avatarClass(c){
  if(c.tipo==='SISTEMA_USUARIO') return 'system';
  if(c.tipo==='USUARIO_ADMIN') return 'attention';
  if(c.tipo==='USUARIO_ROL') return 'role';
  return '';
}

function avatarGlyph(c){
  if(c.tipo==='SISTEMA_USUARIO') return '⚙️';
  if(c.tipo==='USUARIO_ADMIN') return '👤';
  if(c.tipo==='USUARIO_ROL') return '👥';
  return initials(c.titulo);
}

function mapConv(c){
  return {
    _id:c._id,
    tipo:c.tipo,
    titulo:c.tipo==='USUARIO_ADMIN' ? 'Atención' : (c.tipo==='SISTEMA_USUARIO' ? 'Sistema' : (c.titulo || 'Conversación')),
    ultimoMensaje:c.ultimoMensaje || '',
    fecha:c.ultimoMensajeFecha || null,
    unread:Number(c.unread)||0,
    rolId:c.rolId || ''
  };
}

function row(c){
  const isRole=c.tipo==='USUARIO_ROL';
  return `<button class="row" data-conv="${esc(c._id)}">
    <div class="avatar ${avatarClass(c)}">${esc(avatarGlyph(c))}</div>
    <div class="row-main">
      <div class="name-line">
        <div class="name">${esc(c.titulo)}</div>
        ${isRole?'<span class="role-tag">ROL</span>':''}
      </div>
      <div class="preview">${esc(c.ultimoMensaje||'Sin mensajes')}</div>
    </div>
    <div class="side">
      <span class="time">${fmt(c.fecha)}</span>
      ${c.unread?`<span class="unread">${c.unread}</span>`:''}
      <span class="chev">›</span>
    </div>
  </button>`;
}

function renderConversations(){
  const q=$('#conversationSearch').value.trim().toLocaleLowerCase('es-MX');
  let items=state.conversations.filter(c=>{
    if(!q) return true;
    return String(c.titulo||'').toLocaleLowerCase('es-MX').includes(q);
  });
  if(state.unreadOnly) items=items.filter(c=>c.unread>0);
  items.sort((a,b)=>(new Date(b.fecha||0).getTime())-(new Date(a.fecha||0).getTime()));

  $('#conversationList').innerHTML=items.length
    ? items.map(row).join('')
    : '<div class="empty">No hay conversaciones que coincidan con el filtro.</div>';

  const total=state.conversations.reduce((n,c)=>n+c.unread,0);
  $('#globalBadge').textContent=total>99?'99+':total;
  $('#globalBadge').classList.toggle('hidden',!total);
  $('#unreadFilterCount').textContent=total>99?'99+':total;
  $('#unreadFilterCount').classList.toggle('hidden',!total);

  const att=state.conversations.filter(c=>c.tipo==='USUARIO_ADMIN').reduce((n,c)=>n+c.unread,0);
  $('#attentionBadge').textContent=att>99?'99+':att;
  $('#attentionBadge').classList.toggle('hidden',!att);
}

function renderContacts(target='#contactsList',filter=''){
  const q=filter.trim().toLocaleLowerCase('es-MX');
  const roles=state.roles
    .filter(r=>r.asignado)
    .filter(r=>!q || String(r.nombre||'').toLocaleLowerCase('es-MX').includes(q));
  const users=state.users.filter(u=>!q || String(u.nombreVisible||'').toLocaleLowerCase('es-MX').includes(q));

  $(target).innerHTML=`
    <div class="group-title">ROLES</div>
    <div class="contact-list">
      ${roles.length?roles.map(r=>`
        <button class="contact-row" data-contact-kind="ROLE" data-contact-id="${esc(r.roleId)}">
          <div class="avatar role">👥</div>
          <div class="row-main">
            <div class="name-line"><div class="name">${esc(r.nombre)}</div><span class="role-tag">ROL</span></div>
          </div>
          <span class="chev">›</span>
        </button>`).join(''):'<div class="empty">Sin roles disponibles.</div>'}
    </div>

    <div class="group-title">CONTACTOS</div>
    <div class="contact-list">
      ${users.length?users.map(u=>`
        <button class="contact-row" data-contact-kind="USER" data-contact-id="${esc(u.memberId)}">
          <div class="avatar">${esc(initials(u.nombreVisible))}</div>
          <div class="row-main"><div class="name">${esc(u.nombreVisible)}</div></div>
          <span class="chev">›</span>
        </button>`).join(''):'<div class="empty">Sin contactos disponibles.</div>'}
    </div>`;
}

function renderNewContacts(){
  renderContacts('#newContactsList',$('#newContactsSearch').value);
}

async function renderExactResult(){
  const raw=$('#exactSearch').value.trim();
  const out=$('#exactResult');
  if(!raw){out.innerHTML='';return}

  // Privacidad: la UI no consulta por prefijos ni muestra sugerencias parciales.
  // El backend también exige coincidencia exacta.
  if(raw.length<5){
    out.innerHTML='<div class="result-none">Sin coincidencia exacta.</div>';
    return;
  }

  const cacheKey=raw.toLocaleLowerCase('es-MX');
  if(state.exactSearchCache.has(cacheKey)){
    const u=state.exactSearchCache.get(cacheKey);
    out.innerHTML=u
      ? `<div class="result-ok">
          <button class="contact-row" data-contact-kind="NEWUSER" data-contact-id="${esc(u.memberId)}">
            <div class="avatar">${esc(initials(u.nombreVisible))}</div>
            <div class="row-main"><div class="name">${esc(u.nombreVisible)}</div></div>
            <span class="chev">›</span>
          </button>
        </div>`
      : '<div class="result-none">Sin coincidencia exacta.</div>';
    return;
  }

  out.innerHTML='<div class="result-none">Buscando…</div>';
  try{
    const r=await request('mnsSearchUserExact',{
      appId:state.context.appId,
      eoId:state.context.eoId,
      query:raw
    });
    const u=r?.user||null;
    state.exactSearchCache.set(cacheKey,u);
    // Ignorar respuestas viejas si el usuario ya cambió la consulta.
    if($('#exactSearch').value.trim()!==raw) return;
    out.innerHTML=u
      ? `<div class="result-ok">
          <button class="contact-row" data-contact-kind="NEWUSER" data-contact-id="${esc(u.memberId)}">
            <div class="avatar">${esc(initials(u.nombreVisible))}</div>
            <div class="row-main"><div class="name">${esc(u.nombreVisible)}</div></div>
            <span class="chev">›</span>
          </button>
        </div>`
      : '<div class="result-none">Sin coincidencia exacta.</div>';
  }catch(e){
    if($('#exactSearch').value.trim()===raw){
      out.innerHTML='<div class="result-none">No fue posible realizar la búsqueda.</div>';
    }
  }
}

async function loadBase(){
  state.loading=true;
  try{
    // Las tres lecturas son independientes: se lanzan simultáneamente para
    // que la carga inicial cueste un solo tramo de latencia de red.
    const [init,inbox,directory]=await Promise.all([
      request('mnsInit',{appId:state.context.appId,eoId:state.context.eoId}),
      request('mnsGetInbox',{appId:state.context.appId,eoId:state.context.eoId}),
      request('mnsGetDirectory',{appId:state.context.appId,eoId:state.context.eoId})
    ]);
    state.session=init;
    state.conversations=(inbox.items||[]).map(mapConv);
    state.roles=directory.roles||[];
    state.users=directory.users||[];
    renderConversations();
    renderContacts();
  }finally{
    state.loading=false;
  }
}

async function openConversation(c){
  state.active=c;

  // La lectura se refleja localmente de inmediato; no esperamos una recarga
  // completa de bandeja para que la UI responda.
  const local=state.conversations.find(x=>x._id===c._id);
  if(local) local.unread=0;
  c.unread=0;
  renderConversations();

  $('#chatTitle').textContent=c.titulo;
  $('#chatType').textContent=
    c.tipo==='USUARIO_ROL'?'Rol':
    c.tipo==='SISTEMA_USUARIO'?'Sistema':
    c.tipo==='USUARIO_ADMIN'?'Atención':'Contacto';
  $('#chatAvatar').textContent=avatarGlyph(c);
  $('#chatAvatar').className='avatar '+avatarClass(c);

  const readonly=c.tipo==='SISTEMA_USUARIO';
  $('#composer').classList.toggle('hidden',readonly);
  $('#readonly').classList.toggle('hidden',!readonly);

  showMain('chat');

  // Si ya se visitó esta conversación, la mostramos instantáneamente.
  if(state.messages[c._id]){
    renderMessages();
  }else{
    $('#chat').innerHTML='<div class="empty">Cargando mensajes…</div>';
  }

  try{
    // Mensajes y marcado de lectura son independientes: se ejecutan en paralelo.
    const [messagesResult]=await Promise.all([
      request('mnsGetMessages',{conversationId:c._id,offset:0,limit:100}),
      request('mnsMarkConversationRead',{conversationId:c._id}).catch(()=>null)
    ]);
    state.messages[c._id]=messagesResult.messages||[];
    if(state.active?._id===c._id) renderMessages();
  }catch(e){
    if(!state.messages[c._id]){
      $('#chat').innerHTML=`<div class="empty">${esc(e.message)}</div>`;
    }else{
      toast(e.message);
    }
  }
}

function renderMessages(){
  const c=state.active;
  const ms=state.messages[c?._id]||[];
  let lastDay='';
  $('#chat').innerHTML=ms.map(m=>{
    const d=new Date(m.fechaEnvio);
    const day=Number.isNaN(d.getTime())?'':d.toDateString();
    const head=day && day!==lastDay
      ? `<div class="day"><span>${day===new Date().toDateString()?'HOY':d.toLocaleDateString('es-MX',{day:'numeric',month:'long'})}</span></div>`
      : '';
    if(day) lastDay=day;
    return head+`<div class="bubble-line ${m.propio?'mine':''}">
      <div class="bubble">${esc(m.texto)}<div class="stamp">${Number.isNaN(d.getTime())?'':d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div></div>
    </div>`;
  }).join('')||'<div class="empty">Sin mensajes.</div>';
  requestAnimationFrame(()=>$('#chat').scrollTop=$('#chat').scrollHeight);
}

async function openSpecial(kind){
  try{
    const action=kind==='ADMIN'?'mnsOpenAdmin':'mnsOpenSystem';
    const r=await request(action,{appId:state.context.appId,eoId:state.context.eoId});
    const c=mapConv(r.conversation);
    if(!state.conversations.some(x=>x._id===c._id)) state.conversations.unshift(c);
    await openConversation(c);
  }catch(e){toast(e.message)}
}

async function openContact(kind,id){
  try{
    const payload={appId:state.context.appId,eoId:state.context.eoId};
    let action;
    if(kind==='ROLE'){
      action='mnsOpenRole';
      payload.roleId=id;
    }else{
      action='mnsOpenDirect';
      payload.targetMemberId=id;
    }
    const r=await request(action,payload);
    const c=mapConv(r.conversation);
    if(!state.conversations.some(x=>x._id===c._id)) state.conversations.unshift(c);
    $('#newOverlay').classList.remove('on');
    await openConversation(c);
  }catch(e){toast(e.message)}
}

function openNew(){
  $$('[data-newtab]').forEach(b=>b.classList.toggle('on',b.dataset.newtab==='contacts'));
  $('#newContactsPane').classList.remove('hidden');
  $('#newExternalPane').classList.add('hidden');
  $('#newContactsSearch').value='';
  $('#exactSearch').value='';
  $('#exactResult').innerHTML='';
  renderNewContacts();
  $('#newOverlay').classList.add('on');
}

async function sendMessage(){
  if(!state.active || state.active.tipo==='SISTEMA_USUARIO') return;
  const t=$('#messageText').value.trim();
  if(!t) return;

  const conversationId=state.active._id;
  const operationId=uid();
  const tempId=`local-${operationId}`;
  const now=new Date();

  // Envío optimista: el mensaje aparece antes de esperar a Wix.
  const optimistic={
    _id:tempId,
    remitenteTipo:'USUARIO',
    remitenteMemberId:state.session?.memberId||'',
    remitenteRolId:'',
    texto:t,
    fechaEnvio:now.toISOString(),
    propio:true,
    pendiente:true
  };

  if(!state.messages[conversationId]) state.messages[conversationId]=[];
  state.messages[conversationId].push(optimistic);
  $('#messageText').value='';

  const conv=state.conversations.find(x=>x._id===conversationId);
  if(conv){
    conv.ultimoMensaje=t;
    conv.fecha=now.toISOString();
    conv.unread=0;
  }
  renderMessages();
  renderConversations();

  try{
    const r=await request('mnsSendMessage',{
      conversationId,
      texto:t,
      operationId
    });

    const serverMessage={
      ...(r.message||{}),
      propio:true
    };
    const list=state.messages[conversationId]||[];
    const idx=list.findIndex(x=>x._id===tempId);
    if(idx>=0) list[idx]=serverMessage;
    if(state.active?._id===conversationId) renderMessages();

    // No se vuelve a descargar ni mensajes ni bandeja: el backend ya confirmó
    // el mensaje y la UI mantiene el preview localmente.
  }catch(e){
    const list=state.messages[conversationId]||[];
    const idx=list.findIndex(x=>x._id===tempId);
    if(idx>=0) list.splice(idx,1);
    if(state.active?._id===conversationId) renderMessages();
    toast(e.message);
  }
}

$('#conversationSearch').addEventListener('input',renderConversations);
$('#contactSearch').addEventListener('input',()=>renderContacts('#contactsList',$('#contactSearch').value));
$('#newContactsSearch').addEventListener('input',renderNewContacts);

let exactTimer=null;
$('#exactSearch').addEventListener('input',()=>{
  clearTimeout(exactTimer);
  exactTimer=setTimeout(renderExactResult,180);
});

$('#btnUnread').onclick=()=>{
  state.unreadOnly=!state.unreadOnly;
  $('#btnUnread').classList.toggle('on',state.unreadOnly);
  renderConversations();
};

$('#btnAttention').onclick=()=>openSpecial('ADMIN');
$('#btnSystem').onclick=()=>openSpecial('SYSTEM');
$('#btnContacts').onclick=()=>{
  $('#contactSearch').value='';
  renderContacts();
  showMain('contacts');
};
$('#btnNew').onclick=openNew;
$('#btnChatBack').onclick=()=>showMain('home');
$('#btnExit').onclick=()=>{
  if($('#chatView').classList.contains('active')||$('#contactsView').classList.contains('active')) showMain('home');
  else window.parent.postMessage({channel:CHANNEL,type:'CLOSE'},window.location.origin);
};
$('#newOverlay').addEventListener('click',e=>{
  if(e.target===$('#newOverlay')) $('#newOverlay').classList.remove('on');
});

$$('[data-newtab]').forEach(b=>b.onclick=()=>{
  const tab=b.dataset.newtab;
  $$('[data-newtab]').forEach(x=>x.classList.toggle('on',x===b));
  $('#newContactsPane').classList.toggle('hidden',tab!=='contacts');
  $('#newExternalPane').classList.toggle('hidden',tab!=='new');
});

document.addEventListener('click',e=>{
  const conv=e.target.closest('[data-conv]');
  if(conv){
    const c=state.conversations.find(x=>x._id===conv.dataset.conv);
    if(c) openConversation(c);
  }
  const ct=e.target.closest('[data-contact-kind]');
  if(ct&&!ct.disabled) openContact(ct.dataset.contactKind,ct.dataset.contactId);
});

$('#btnSend').onclick=sendMessage;
$('#messageText').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

window.addEventListener('message',async event=>{
  if(event.origin!==window.location.origin) return;
  if(event.source!==window.parent) return;
  const m=event.data;
  if(!m||m.channel!==CHANNEL) return;

  if(m.type==='CONTEXT'){
    state.context=m.payload||null;
    try{
      await loadBase();
    }catch(e){
      toast(e.message);
      $('#conversationList').innerHTML=`<div class="empty">${esc(e.message)}</div>`;
    }
    return;
  }

  if(m.id&&pending.has(m.id)){
    const p=pending.get(m.id);
    clearTimeout(p.timer);
    pending.delete(m.id);
    m.ok ? p.resolve(m.data) : p.reject(new Error(m.error||'Error de MNS.'));
  }
});

renderConversations();
renderContacts();
window.parent.postMessage({channel:CHANNEL,type:'READY',version:VERSION},window.location.origin);
})();
</script>
</body>
</html>
